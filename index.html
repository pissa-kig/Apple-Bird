<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLE BIRD - AnB GAMES</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/png" href="./favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicons/favicon.svg" />
    <link rel="shortcut icon" href="./favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png" />
    <link rel="manifest" href="./favicons/site.webmanifest" />
</head>
<body>

  <div id="intro-screen" class="intro-screen">
    <div class="intro-content">
      <img src="imgs/AnB_GAMES.png" alt="AnB GAMES Logo" class="intro-logo">
      <p class="intro-text">PRESENTED BY AnB GAMES</p>
    </div>
  </div>

  <div class="game-container">
    <h1 class="game-title">APPLE BIRD</h1>
    <h2 class="game-subtitle">AnB GAMES</h2>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="600"></canvas>

      <div id="countdown-overlay" class="countdown-overlay hidden">
        <span id="countdown-text">3</span>
      </div>
      
      <div id="ui-overlay" class="ui-overlay">
        <div id="start-message" class="overlay-card">
          <h2>READY?</h2>
          <p>Press <strong>SPACEBAR</strong> or <strong>TAP</strong> to Jump</p>
          <button id="start-btn" class="btn">PLAY</button>
        </div>
        <div id="gameover-message" class="overlay-card hidden">
          <h2>GAME OVER</h2>
          <p>Score: <span id="final-score">0</span></p>
          <p>Best: <span id="best-score">0</span></p>
          <button id="restart-btn" class="btn">RESTART</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
